name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project
        run: |
          ls -la
          if ls *.zip >/dev/null 2>&1; then unzip -o '*.zip'; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Build
        run: |
          if [ -d FamilyGuard ]; then cd FamilyGuard; fi
          gradle assembleDebug
          find . -name app-debug.apk -exec cp {} "$GITHUB_WORKSPACE/app-debug.apk" \;
      - uses: actions/upload-artifact@v4
        with:
          name: FamilyGuard-apk
          path: app-debug.apk
